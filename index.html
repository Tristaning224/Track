<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>项目进度时间轴</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --tab-inactive: #dde3ea;
      --primary: #2563eb;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --line: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px 14px 40px;
      line-height: 1.5;
    }
    .app-wrapper { max-width: 720px; margin: 0 auto; }

    /* 顶部云同步状态栏 */
    .sync-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--muted);
      cursor: pointer;
    }
    .sync-pill:hover { background: #fff; color: var(--text); }
    .sync-pill.connected { color: #166534; border-color: #bbf7d0; background: #f0fdf4; }
    .sync-pill.error { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
    .sync-refresh {
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    .sync-refresh:hover { background: #fff; color: var(--primary); }

    /* 文件夹 Tab 栏 */
    .tabs-bar {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      overflow-x: auto;
      padding: 0 4px;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-item {
      padding: 10px 18px;
      background: var(--tab-inactive);
      color: var(--muted);
      border-radius: 10px 10px 0 0;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    .tab-item:hover { background: #e5eaf0; color: var(--text); }
    .tab-item.active {
      background: var(--surface);
      color: var(--primary);
      font-weight: 600;
      padding-top: 12px;
      position: relative;
      z-index: 2;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.03);
    }
    .tab-add {
      padding: 8px 14px;
      background: transparent;
      color: var(--muted);
      border: 1px dashed #94a3b8;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-add:hover { background: rgba(255,255,255,0.5); color: var(--primary); border-color: var(--primary); }

    /* 主体卡片容器 */
    .main-folder {
      background: var(--surface);
      border-radius: 0 12px 12px 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .project-title-wrap { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .project-title { font-size: 20px; font-weight: 700; color: #0f172a; }
    .project-meta { font-size: 12px; color: var(--muted); }
    .project-actions button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .project-actions button:hover { background: #f1f5f9; color: #dc2626; }

    /* 时间轴 */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .timeline { position: relative; padding-left: 22px; margin-bottom: 28px; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--line);
    }
    .tl-node { position: relative; margin-bottom: 14px; }
    .tl-node:last-child { margin-bottom: 0; }
    .tl-dot {
      position: absolute;
      left: -21px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #94a3b8;
    }
    .tl-node.is-latest .tl-dot {
      background: var(--primary);
      border-color: #bfdbfe;
      box-shadow: 0 0 0 3px #eff6ff;
      width: 14px;
      height: 14px;
      left: -22px;
      top: 4px;
    }
    .tl-header { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; padding: 2px 0; }
    .tl-time { font-size: 13px; font-weight: 600; color: var(--muted); }
    .tl-node.is-latest .tl-time { color: var(--primary); font-size: 14px; }
    .tl-badge { font-size: 11px; background: #eff6ff; color: var(--primary); padding: 1px 6px; border-radius: 4px; font-weight: 500; }
    .tl-toggle-hint { font-size: 12px; color: #94a3b8; margin-left: auto; }
    .tl-body {
      margin-top: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tl-node.is-latest .tl-body { background: #f8faff; border-color: #dbeafe; }
    .tl-node.collapsed .tl-body { display: none; }
    .block-item { font-size: 14px; }
    .block-tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 4px; margin-bottom: 4px; }
    .tag-done { background: #dcfce7; color: #166534; }
    .tag-stuck { background: #fef3c7; color: #92400e; }
    .tag-next { background: #dbeafe; color: #1e40af; }
    .block-text { color: var(--text); white-space: pre-wrap; padding-left: 2px; }
    .tl-footer { display: flex; justify-content: flex-end; padding-top: 4px; }
    .btn-del-log { background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; }
    .btn-del-log:hover { color: #dc2626; }

    /* 下方三段式输入区 */
    .input-section { border-top: 2px dashed var(--border); padding-top: 22px; }
    .input-grid { display: flex; flex-direction: column; gap: 14px; }
    .field-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .field-group label span { font-weight: 400; color: var(--muted); font-size: 12px; }
    .field-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      background: #fcfcfd;
    }
    .field-group textarea:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    .field-group.highlight-input textarea { border-color: #bfdbfe; background: #f8faff; }
    .submit-row { margin-top: 16px; display: flex; justify-content: flex-end; }
    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { background: #93c5fd; cursor: not-allowed; }
    .empty-state { color: var(--muted); font-size: 14px; padding: 16px 0; }

    /* 密码弹窗 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-mask.open { display: flex; }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .modal-desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .modal-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .backup-row {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 520px) { .main-folder { padding: 16px; } }
  </style>
</head>
<body>

<div class="app-wrapper">
  <div class="sync-bar">
    <button class="sync-refresh" id="manualSyncBtn" style="display:none;">🔄 同步</button>
    <div class="sync-pill" id="syncPill">🔑 点击输入同步密码</div>
  </div>

  <div class="tabs-bar" id="tabsBar"></div>

  <div class="main-folder">
    <div class="project-header">
      <div class="project-title-wrap">
        <h1 class="project-title" id="projectTitle"></h1>
        <span class="project-meta" id="projectMeta"></span>
      </div>
      <div class="project-actions">
        <button id="renameBtn">重命名</button>
        <button id="deleteBtn">删除项目</button>
      </div>
    </div>

    <div class="section-label">📅 进度时间轴（点击过往时间可展开详情）</div>
    <div class="timeline" id="timeline"></div>

    <div class="input-section">
      <div class="section-label">✍️ 结束前登记本次进度</div>
      <div class="input-grid">
        <div class="field-group">
          <label>1. 今天做了什么 <span>（已完成的小步进展）</span></label>
          <textarea id="inDone" rows="2" placeholder="例如：完成了用户登录接口的验证逻辑"></textarea>
        </div>
        <div class="field-group">
          <label>2. 卡在了哪里 / 当前状态 <span>（报错信息或遗留问题）</span></label>
          <textarea id="inStuck" rows="2" placeholder="例如：目前数据库写入还有个小 Bug，报错信息是 xxx"></textarea>
        </div>
        <div class="field-group highlight-input">
          <label>3. 下次打开第一件要做的事 <span>（越具体越好，方便3秒重启）</span></label>
          <textarea id="inNext" rows="2" placeholder="例如：打开 user.py 第 45 行，检查密码加密字段的长度限制"></textarea>
        </div>
      </div>
      <div class="submit-row">
        <button class="btn-submit" id="submitBtn">保存进度到时间轴</button>
      </div>
    </div>
  </div>
</div>

<!-- 私人密码登录弹窗 -->
<div class="modal-mask" id="syncModal">
  <div class="modal-box">
    <div class="modal-title">🔑 私人密码云同步</div>
    <div class="modal-desc">输入你在 Cloudflare Worker 中设定的私人密码，即可在当前设备自动合并同步所有进度。</div>
    <div class="modal-field" id="apiFieldWrap">
      <label>云接口网址（Worker URL）</label>
      <input type="text" id="cfgApiUrl" placeholder="https://my-sync.ningtrista.workers.dev" />
    </div>
    <div class="modal-field">
      <label>私人密码</label>
      <input type="password" id="cfgPwd" placeholder="输入你的同步密码" />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="clearSyncBtn" style="margin-right:auto;color:#dc2626;">清除本机密码</button>
      <button class="btn-secondary" id="closeModalBtn">取消</button>
      <button class="btn-submit" id="saveSyncBtn" style="padding:9px 18px;">验证并同步</button>
    </div>
    <div class="backup-row">
      <span>本地备份：</span>
      <div>
        <button class="btn-secondary" id="exportBtn" style="padding:4px 10px;font-size:12px;">导出 JSON</button>
        <button class="btn-secondary" id="importBtn" style="padding:4px 10px;font-size:12px;">导入</button>
        <input type="file" id="importFile" accept=".json" style="display:none" />
      </div>
    </div>
  </div>
</div>

<script>
  const DEFAULT_API_URL = 'https://my-sync.ningtrista.workers.dev';

  const STORAGE_KEY = 'folder_timeline_demo_v1';
  const AUTH_KEY = 'folder_timeline_auth_v1';

  const defaultData = {
    isDefault: true,
    updatedAt: 0,
    activeId: 'p1',
    deletedProjectIds: [],
    deletedLogIds: [],
    projects: [
      {
        id: 'p1',
        name: '我的第一个项目',
        updatedAt: 0,
        logs: [
          {
            id: 'l_demo',
            time: '示例记录',
            createdAt: 0,
            done: '部署好了个人项目进度记录网页。',
            stuck: '暂无卡点。',
            next: '点击右上角“重命名”改成自己的项目名称，在下方写下第一条真实进度。'
          }
        ]
      }
    ]
  };

  function safeParse(key, fallback) {
    try {
      const val = localStorage.getItem(key);
      return val ? JSON.parse(val) : fallback;
    } catch {
      return fallback;
    }
  }

  let state = safeParse(STORAGE_KEY, defaultData);
  state.deletedProjectIds = state.deletedProjectIds || [];
  state.deletedLogIds = state.deletedLogIds || [];

  let auth = safeParse(AUTH_KEY, { apiUrl: DEFAULT_API_URL, password: '' });
  if (DEFAULT_API_URL) auth.apiUrl = DEFAULT_API_URL;

  const $ = id => document.getElementById(id);

  function setSyncUI(status, text) {
    const pill = $('syncPill');
    const refreshBtn = $('manualSyncBtn');
    pill.className = 'sync-pill' + (status === 'ok' ? ' connected' : status === 'err' ? ' error' : '');
    pill.textContent = text;
    refreshBtn.style.display = (auth.apiUrl && auth.password) ? 'inline-block' : 'none';
  }

  function saveLocal(markDirty = true) {
    if (markDirty) {
      delete state.isDefault;
      state.updatedAt = Date.now();
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // ================= 核心：按 ID 双向智能合并（永不互相覆盖） =================
  function getLogTs(log) {
    if (log.createdAt) return log.createdAt;
    const m = /^l_(\d+)$/.exec(log.id || '');
    if (m) return Number(m[1]);
    if (log.time && log.time !== '示例记录') {
      const parsed = Date.parse(log.time.replace(' ', 'T'));
      if (!isNaN(parsed)) return parsed;
    }
    return 0;
  }

  function mergeStates(localState, remoteState, preferredActiveId) {
    if (!remoteState || remoteState.empty || !remoteState.projects) return localState;
    if (localState.isDefault && !remoteState.isDefault) {
      return {
        ...remoteState,
        deletedProjectIds: remoteState.deletedProjectIds || [],
        deletedLogIds: remoteState.deletedLogIds || []
      };
    }

    const delProjSet = new Set([
      ...(localState.deletedProjectIds || []),
      ...(remoteState.deletedProjectIds || [])
    ]);
    const delLogSet = new Set([
      ...(localState.deletedLogIds || []),
      ...(remoteState.deletedLogIds || [])
    ]);

    const projMap = new Map();
    const ingestProject = (p) => {
      if (!p || delProjSet.has(p.id)) return;
      if (!projMap.has(p.id)) {
        projMap.set(p.id, {
          id: p.id,
          name: p.name,
          updatedAt: p.updatedAt || 0,
          logs: [...(p.logs || [])]
        });
      } else {
        const existing = projMap.get(p.id);
        // 项目名取更新的那一边
        if ((p.updatedAt || 0) >= (existing.updatedAt || 0)) {
          existing.name = p.name;
          existing.updatedAt = p.updatedAt || existing.updatedAt;
        }
        existing.logs = existing.logs.concat(p.logs || []);
      }
    };

    (remoteState.projects || []).forEach(ingestProject);
    (localState.projects || []).forEach(ingestProject);

    const mergedProjects = [];
    for (const proj of projMap.values()) {
      const logMap = new Map();
      for (const log of proj.logs) {
        if (!log || delLogSet.has(log.id)) continue;
        if (!logMap.has(log.id)) {
          logMap.set(log.id, log);
        }
      }
      const uniqueLogs = Array.from(logMap.values()).sort((a, b) => getLogTs(b) - getLogTs(a));
      mergedProjects.push({
        id: proj.id,
        name: proj.name,
        updatedAt: proj.updatedAt,
        logs: uniqueLogs
      });
    }

    if (mergedProjects.length === 0) {
      mergedProjects.push({ id: 'p_' + Date.now(), name: '我的项目', updatedAt: Date.now(), logs: [] });
    }

    const activeExists = mergedProjects.some(p => p.id === preferredActiveId);
    return {
      updatedAt: Math.max(localState.updatedAt || 0, remoteState.updatedAt || 0),
      activeId: activeExists ? preferredActiveId : mergedProjects[0].id,
      deletedProjectIds: Array.from(delProjSet).slice(-200),
      deletedLogIds: Array.from(delLogSet).slice(-500),
      projects: mergedProjects
    };
  }

  function contentSignature(s) {
    return JSON.stringify({
      projects: s.projects || [],
      deletedProjectIds: s.deletedProjectIds || [],
      deletedLogIds: s.deletedLogIds || []
    });
  }

  // ================= Worker 通信（带 6 秒超时） =================
  async function apiFetch(method = 'GET', bodyData = null) {
    const url = auth.apiUrl.replace(/\/+$/, '');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6000);
    const opts = {
      method,
      cache: 'no-store',
      signal: controller.signal,
      headers: { 'X-Password': auth.password }
    };
    if (bodyData) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(bodyData);
    }
    try {
      const res = await fetch(url, opts);
      if (res.status === 401) throw new Error('AUTH_FAIL');
      if (res.status === 500) throw new Error('SERVER_500');
      if (!res.ok) throw new Error('HTTP_' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  let syncInFlight = false;
  async function syncWithCloud(forcePushIfLocalChanged = false) {
    if (!auth.apiUrl || !auth.password) return false;
    if (syncInFlight) return true;
    syncInFlight = true;
    setSyncUI('syncing', '☁️ 同步合并中...');
    try {
      const remote = await apiFetch('GET');
      if (remote && !remote.empty && remote.projects) {
        const merged = mergeStates(state, remote, state.activeId);
        const localChanged = contentSignature(merged) !== contentSignature(state);
        const remoteNeedsUpdate = forcePushIfLocalChanged || (contentSignature(merged) !== contentSignature(remote));

        if (localChanged || state.isDefault) {
          state = merged;
          saveLocal(false);
          renderAll();
        }
        if (remoteNeedsUpdate && !state.isDefault) {
          const postRes = await apiFetch('POST', state);
          if (postRes && postRes.data && postRes.data.projects) {
            state = mergeStates(state, postRes.data, state.activeId);
            saveLocal(false);
            renderAll();
          }
        }
      } else if (!state.isDefault) {
        await apiFetch('POST', state);
      }
      setSyncUI('ok', '☁️ 已同步 ' + new Date().toTimeString().slice(0, 5));
      return true;
    } catch (e) {
      if (e.message === 'AUTH_FAIL') {
        setSyncUI('err', '🔒 密码错误（点击重输）');
      } else if (e.message === 'SERVER_500') {
        setSyncUI('err', '⚠️ 云端500（检查KV绑定）');
      } else if (e.name === 'AbortError') {
        setSyncUI('err', '⚠️ 连接超时（检查梯子后点🔄）');
      } else {
        setSyncUI('err', '⚠️ 网络失败（已存本地，点🔄重试）');
      }
      return false;
    } finally {
      syncInFlight = false;
    }
  }

  function saveAndSync() {
    saveLocal(true);
    renderAll();
    syncWithCloud(true);
  }

  // ================= 渲染逻辑 =================
  function getActiveProject() {
    return state.projects.find(p => p.id === state.activeId) || state.projects[0];
  }

  function renderTabs() {
    const bar = $('tabsBar');
    bar.innerHTML = '';
    state.projects.forEach(proj => {
      const tab = document.createElement('div');
      tab.className = 'tab-item' + (proj.id === state.activeId ? ' active' : '');
      tab.textContent = proj.name;
      tab.onclick = () => {
        state.activeId = proj.id;
        saveLocal(false);
        renderAll();
      };
      bar.appendChild(tab);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'tab-add';
    addBtn.textContent = '+ 新建项目';
    addBtn.onclick = () => {
      const name = prompt('请输入新项目（文件夹）名称：');
      if (!name || !name.trim()) return;
      const newProj = { id: 'p_' + Date.now(), name: name.trim(), updatedAt: Date.now(), logs: [] };
      state.projects.push(newProj);
      state.activeId = newProj.id;
      saveAndSync();
    };
    bar.appendChild(addBtn);
  }

  function renderTimeline(proj) {
    const container = $('timeline');
    container.innerHTML = '';
    if (!proj.logs || proj.logs.length === 0) {
      container.innerHTML = '<div class="empty-state">这个文件夹还是空的，在下方记录第一条进度吧 👇</div>';
      return;
    }

    proj.logs.forEach((log, index) => {
      const isLatest = index === 0;
      const node = document.createElement('div');
      node.className = 'tl-node' + (isLatest ? ' is-latest' : ' collapsed');

      const dot = document.createElement('div');
      dot.className = 'tl-dot';

      const header = document.createElement('div');
      header.className = 'tl-header';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'tl-time';
      timeSpan.textContent = log.time;
      header.appendChild(timeSpan);

      if (isLatest) {
        const badge = document.createElement('span');
        badge.className = 'tl-badge';
        badge.textContent = '最新进度';
        header.appendChild(badge);
      }

      const hint = document.createElement('span');
      hint.className = 'tl-toggle-hint';
      hint.textContent = isLatest ? '收起 ▲' : '展开 ▼';
      header.appendChild(hint);

      header.onclick = () => {
        const isCollapsed = node.classList.toggle('collapsed');
        hint.textContent = isCollapsed ? '展开 ▼' : '收起 ▲';
      };

      const body = document.createElement('div');
      body.className = 'tl-body';
      const blocks = [
        { label: '今天做了什么', cls: 'tag-done', val: log.done },
        { label: '卡在了哪里 / 当前状态', cls: 'tag-stuck', val: log.stuck },
        { label: '下次打开第一件要做的事', cls: 'tag-next', val: log.next }
      ];
      blocks.forEach(b => {
        const item = document.createElement('div');
        item.className = 'block-item';
        const tag = document.createElement('span');
        tag.className = 'block-tag ' + b.cls;
        tag.textContent = b.label;
        const text = document.createElement('div');
        text.className = 'block-text';
        text.textContent = b.val || '（未填写）';
        item.appendChild(tag);
        item.appendChild(text);
        body.appendChild(item);
      });

      const footer = document.createElement('div');
      footer.className = 'tl-footer';
      const delLogBtn = document.createElement('button');
      delLogBtn.className = 'btn-del-log';
      delLogBtn.textContent = '删除此条记录';
      delLogBtn.onclick = () => {
        if (!confirm('确定删除这条时间轴记录吗？')) return;
        state.deletedLogIds.push(log.id);
        proj.logs.splice(index, 1);
        saveAndSync();
      };
      footer.appendChild(delLogBtn);
      body.appendChild(footer);

      node.appendChild(dot);
      node.appendChild(header);
      node.appendChild(body);
      container.appendChild(node);
    });
  }

  function renderAll() {
    renderTabs();
    const proj = getActiveProject();
    if (!proj) return;
    $('projectTitle').textContent = proj.name;
    $('projectMeta').textContent = `共 ${(proj.logs || []).length} 条节点记录`;
    renderTimeline(proj);
  }

  // ================= 事件绑定 =================
  $('submitBtn').onclick = () => {
    const done = $('inDone').value.trim();
    const stuck = $('inStuck').value.trim();
    const next = $('inNext').value.trim();
    if (!done && !stuck && !next) return alert('至少填写一项内容再保存哦');

    const nowTs = Date.now();
    const now = new Date(nowTs);
    const pad = n => String(n).padStart(2, '0');
    const timeStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

    const proj = getActiveProject();
    proj.logs.unshift({
      id: 'l_' + nowTs + '_' + Math.random().toString(36).slice(2, 6),
      createdAt: nowTs,
      time: timeStr,
      done,
      stuck,
      next
    });

    $('inDone').value = '';
    $('inStuck').value = '';
    $('inNext').value = '';

    saveAndSync();
  };

  $('renameBtn').onclick = () => {
    const proj = getActiveProject();
    const newName = prompt('修改项目名称：', proj.name);
    if (newName && newName.trim()) {
      proj.name = newName.trim();
      proj.updatedAt = Date.now();
      saveAndSync();
    }
  };

  $('deleteBtn').onclick = () => {
    if (state.projects.length <= 1) return alert('至少需要保留一个项目标签');
    const proj = getActiveProject();
    if (!confirm(`确定要删除「${proj.name}」及其所有时间轴记录吗？`)) return;
    state.deletedProjectIds.push(proj.id);
    state.projects = state.projects.filter(p => p.id !== proj.id);
    state.activeId = state.projects[0].id;
    saveAndSync();
  };

  function openAuthModal() {
    $('cfgApiUrl').value = auth.apiUrl || DEFAULT_API_URL;
    $('cfgPwd').value = auth.password || '';
    $('apiFieldWrap').style.display = DEFAULT_API_URL ? 'none' : 'block';
    $('syncModal').classList.add('open');
    setTimeout(() => $('cfgPwd').focus(), 100);
  }

  $('syncPill').onclick = openAuthModal;
  $('closeModalBtn').onclick = () => $('syncModal').classList.remove('open');
  $('syncModal').onclick = (e) => {
    if (e.target === $('syncModal')) $('syncModal').classList.remove('open');
  };

  $('saveSyncBtn').onclick = async () => {
    const apiUrl = ($('cfgApiUrl').value.trim() || auth.apiUrl || DEFAULT_API_URL).trim();
    const password = $('cfgPwd').value.trim();
    if (!apiUrl) return alert('请填入 Cloudflare Worker 网址');
    if (!password) return alert('请输入私人密码');

    auth = { apiUrl, password };
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    $('syncModal').classList.remove('open');
    const ok = await syncWithCloud();
    if (!ok) openAuthModal();
  };
  $('cfgPwd').onkeydown = (e) => { if (e.key === 'Enter') $('saveSyncBtn').click(); };

  $('clearSyncBtn').onclick = () => {
    if (!confirm('确定清除本机保存的密码吗？（云端数据安全保留）')) return;
    auth.password = '';
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    $('syncModal').classList.remove('open');
    setSyncUI('none', '🔑 点击输入同步密码');
  };

  $('manualSyncBtn').onclick = () => syncWithCloud(false);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && auth.apiUrl && auth.password) {
      syncWithCloud(false);
    }
  });

  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `project-timeline-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (imported.projects) {
          state = mergeStates(state, imported, state.activeId);
          saveAndSync();
          $('syncModal').classList.remove('open');
          alert('导入并合并成功！');
        }
      } catch { alert('文件格式不对'); }
    };
    reader.readAsText(file);
  };

  renderAll();
  if (auth.apiUrl && auth.password) {
    syncWithCloud(false);
  } else {
    openAuthModal();
  }
</script>
</body>
</html>
